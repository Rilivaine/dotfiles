# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above


##! Window
bind = Super, G, togglegroup, # Toggle the window group mode
bind = Super, Tab, changegroupactive, f # Switch to next windows in current group
bind = Super+Shift, Tab, changegroupactive, b # Switch to previous window in current group

##! Misc
bind = Alt, equal, exec, $hyprScr/clipboard-typer.sh # Run clipboard typer
bindn = , Escape, exec, kill "$(cat /tmp/clipboard-typer.pid)" 2>/dev/null # Stop clipboard typer

##! Workspaces
# Move/Change window focus
bind = Super, h, movefocus, l # [hidden]
bind = Super, l, movefocus, r # [hidden]
bind = Super, k, movefocus, u # [hidden]
bind = Super, j, movefocus, d # [hidden]

# Switch workspaces
bind = Super, 1, workspace, 1 # [hidden]
bind = Super, 2, workspace, 2 # [hidden]
bind = Super, 3, workspace, 3 # [hidden]
bind = Super, 4, workspace, 4 # [hidden]
bind = Super, 5, workspace, 5 # [hidden]
bind = Super, 6, workspace, 6 # [hidden]
bind = Super, 7, workspace, 7 # [hidden]
bind = Super, 8, workspace, 8 # [hidden]
bind = Super, 9, workspace, 9 # [hidden]
bind = Super, 0, workspace, 10 # [hidden]

# Move focused window to a workspace
bind = Super+Shift, 1, movetoworkspace, 1 # [hidden]
bind = Super+Shift, 2, movetoworkspace, 2 # [hidden]
bind = Super+Shift, 3, movetoworkspace, 3 # [hidden]
bind = Super+Shift, 4, movetoworkspace, 4 # [hidden]
bind = Super+Shift, 5, movetoworkspace, 5 # [hidden]
bind = Super+Shift, 6, movetoworkspace, 6 # [hidden]
bind = Super+Shift, 7, movetoworkspace, 7 # [hidden]
bind = Super+Shift, 8, movetoworkspace, 8 # [hidden]
bind = Super+Shift, 9, movetoworkspace, 9 # [hidden]
bind = Super+Shift, 0, movetoworkspace, 10 # [hidden]

# Move focused window to a workspace silently
bind = Super+Alt, 1, movetoworkspacesilent, 1 # [hidden]
bind = Super+Alt, 2, movetoworkspacesilent, 2 # [hidden]
bind = Super+Alt, 3, movetoworkspacesilent, 3 # [hidden]
bind = Super+Alt, 4, movetoworkspacesilent, 4 # [hidden]
bind = Super+Alt, 5, movetoworkspacesilent, 5 # [hidden]
bind = Super+Alt, 6, movetoworkspacesilent, 6 # [hidden]
bind = Super+Alt, 7, movetoworkspacesilent, 7 # [hidden]
bind = Super+Alt, 8, movetoworkspacesilent, 8 # [hidden]
bind = Super+Alt, 9, movetoworkspacesilent, 9 # [hidden]
bind = Super+Alt, 0, movetoworkspacesilent, 10 # [hidden]

# Move selected workspace to a relative monitor
bind = Super+Shift, h, exec, $hyprScr/move_workspace_to_monitor.sh left # [hidden]
bind = Super+Shift, l, exec, $hyprScr/move_workspace_to_monitor.sh right # [hidden]
bind = Super+Shift, k, exec, $hyprScr/move_workspace_to_monitor.sh up # [hidden]
bind = Super+Shift, j, exec, $hyprScr/move_workspace_to_monitor.sh down # [hidden]